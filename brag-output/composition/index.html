<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Outbound Checklist — Brag</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/TextPlugin.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0d1117;
        font-family: 'DM Sans', sans-serif;
      }
      .mono { font-family: 'DM Mono', monospace; }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .clip { position: absolute; inset: 0; }

      /* ── SCENE 1 — HOOK ── */
      #scene-hook {
        background: #0d1117;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #hook-wrap {
        display: flex;
        align-items: baseline;
        justify-content: center;
        max-width: 1500px;
      }
      #hook-line {
        font-size: 68px;
        font-weight: 600;
        color: #e6edf3;
        letter-spacing: -0.01em;
      }
      #hook-cursor {
        font-size: 68px;
        font-weight: 400;
        color: #38bdf8;
        margin-left: 4px;
      }

      /* ── SCENE 2 — APP ── */
      #scene-app {
        background: linear-gradient(180deg, #010409 0%, #0d1117 22%, #0d1117 100%);
      }
      #topbar {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 118px;
        display: flex;
        align-items: center;
        padding: 0 64px;
        box-shadow: 0 2px 24px rgba(0,0,0,.6);
      }
      #app-icon {
        width: 52px; height: 52px;
        border-radius: 14px;
        background: rgba(56,189,248,.1);
        border: 1.5px solid rgba(56,189,248,.35);
        display: flex; align-items: center; justify-content: center;
        margin-right: 20px;
        flex-shrink: 0;
      }
      #app-icon svg { width: 26px; height: 26px; }
      #app-title { font-size: 30px; font-weight: 600; color: #e6edf3; line-height: 1.2; }
      #app-sub { font-size: 14px; color: #8b949e; font-family: 'DM Mono', monospace; margin-top: 4px; letter-spacing: .02em; }
      #wordmark {
        margin-left: auto;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: .16em;
        color: #e6edf3;
      }

      #tabstrip {
        position: absolute;
        top: 150px; left: 64px;
        display: flex;
        gap: 10px;
      }
      .tab {
        padding: 12px 26px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 10px 10px 0 0;
        border: 1.5px solid #21262d;
        border-bottom: none;
        color: #8b949e;
      }

      #pallet-card {
        position: absolute;
        top: 188px; left: 64px; right: 64px; bottom: 190px;
        background: #161b22;
        border: 1.5px solid #30363d;
        border-radius: 16px;
        padding: 48px 64px;
      }

      .field-label {
        font-size: 14px;
        font-weight: 600;
        color: #8b949e;
        text-transform: uppercase;
        letter-spacing: .07em;
        margin-bottom: 10px;
      }
      .value-box {
        display: inline-flex;
        align-items: center;
        padding: 14px 22px;
        background: #0d1117;
        border: 2px solid #30363d;
        border-radius: 10px;
        font-size: 26px;
        color: #e6edf3;
      }
      #pn-row { margin-bottom: 46px; }

      #section-label {
        font-size: 15px;
        font-weight: 700;
        color: #8b949e;
        text-transform: uppercase;
        letter-spacing: .08em;
        margin-bottom: 22px;
      }
      #box-rows { display: flex; gap: 24px; margin-bottom: 54px; }
      .box-row { text-align: left; }
      .box-row .value-box { min-width: 130px; justify-content: center; font-family: 'DM Mono', monospace; font-weight: 700; }

      #progress-block { margin-top: 8px; }
      #progress-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 16px;
      }
      #pb-counter {
        font-size: 30px;
        font-weight: 700;
        color: #e6edf3;
      }
      #pb-track {
        width: 100%;
        height: 22px;
        background: #21262d;
        border-radius: 11px;
        overflow: hidden;
      }
      #pb-fill {
        width: 100%;
        height: 100%;
        background: #6e7681;
        transform-origin: left center;
        border-radius: 11px;
      }

      #validation-strip {
        margin-top: 44px;
        padding-top: 28px;
        border-top: 1.5px solid #21262d;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #v-badge {
        font-size: 22px;
        font-weight: 700;
        font-family: 'DM Mono', monospace;
        color: #8b949e;
        letter-spacing: .03em;
      }

      /* Caption strip below the card */
      #caption {
        position: absolute;
        left: 64px; right: 64px; top: 920px;
        text-align: center;
        font-size: 30px;
        font-weight: 600;
        color: #e6edf3;
      }

      /* Over-target toast */
      #toast {
        position: absolute;
        top: 50%; left: 50%;
        width: 620px;
        padding: 38px 46px;
        background: #161b22;
        border: 2px solid #dc2626;
        border-radius: 18px;
        box-shadow: 0 20px 60px rgba(0,0,0,.55);
        text-align: center;
        opacity: 0;
        visibility: hidden;
      }
      #toast-title {
        font-size: 36px;
        font-weight: 700;
        color: #f87171;
        letter-spacing: .01em;
        margin-bottom: 10px;
      }
      #toast-sub {
        font-size: 20px;
        color: #e6edf3;
        font-family: 'DM Mono', monospace;
      }

      /* Report preview card — tucked in the free strip below the pallet card */
      #report-card {
        position: absolute;
        right: 64px;
        bottom: 24px;
        width: 176px;
        height: 148px;
        background: #f6f8fa;
        border-radius: 10px;
        box-shadow: 0 16px 40px rgba(0,0,0,.5);
        padding: 16px 18px;
        opacity: 0;
      }
      .rline { height: 6px; background: #d0d7de; border-radius: 3px; margin-bottom: 9px; }
      .rline.w60 { width: 60%; }
      .rline.w90 { width: 90%; }
      .rline.w40 { width: 40%; }
      #report-tag {
        margin-top: 14px;
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .06em;
        color: rgb(16,121,55);
        background: rgba(22,163,74,.12);
        border-radius: 6px;
        padding: 4px 10px;
      }

      /* Outro block */
      #outro {
        position: absolute;
        left: 0; right: 0;
        top: 858px;
        text-align: center;
        opacity: 0;
      }
      #outro-title { font-size: 46px; font-weight: 700; color: #e6edf3; }
      #outro-sub { font-size: 22px; color: #8b949e; margin-top: 10px; font-family: 'DM Mono', monospace; }
      #outro-wordmark {
        position: absolute;
        left: 64px; bottom: 40px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: .16em;
        color: #8b949e;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19.5" data-width="1920" data-height="1080">

      <!-- ══ SCENE 1 — HOOK (0.00–3.70) ══ -->
      <section id="scene-hook" class="clip" data-start="0" data-duration="3.7" data-track-index="0">
        <div id="hook-wrap">
          <span id="hook-line"></span><span id="hook-cursor">|</span>
        </div>
      </section>

      <!-- ══ SCENE 2 — APP (3.70–19.50) ══ -->
      <section id="scene-app" class="clip" data-start="3.7" data-duration="15.8" data-track-index="1">

        <div id="topbar">
          <div id="app-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="9" width="7" height="10" rx="1"></rect>
              <rect x="14" y="5" width="7" height="14" rx="1"></rect>
            </svg>
          </div>
          <div>
            <div id="app-title">Outbound Checklist</div>
            <div id="app-sub">SEVENUM NL · PRE-SHIPMENT VERIFICATION</div>
          </div>
          <div id="wordmark">ARROW</div>
        </div>

        <div id="tabstrip">
          <div class="tab mono" id="tab1">Pallet 1</div>
          <div class="tab mono" id="tab2">Pallet 2</div>
        </div>

        <div id="pallet-card">
          <div id="pn-row">
            <div class="field-label">Pick Label PN</div>
            <div class="value-box mono" id="pn-box">AS-4471-B</div>
          </div>

          <div id="section-label">Box Verification</div>
          <div id="box-rows">
            <div class="box-row">
              <div class="field-label">Box 1</div>
              <div class="value-box" id="box1-box">6</div>
            </div>
            <div class="box-row">
              <div class="field-label">Box 2</div>
              <div class="value-box" id="box2-box">3</div>
            </div>
          </div>

          <div id="progress-block">
            <div id="progress-head">
              <div class="field-label" style="margin-bottom:0">Verified / Target</div>
              <div id="pb-counter" class="mono">0 / 9</div>
            </div>
            <div id="pb-track">
              <div id="pb-fill"></div>
            </div>
          </div>

          <div id="validation-strip">
            <div class="field-label" style="margin-bottom:0">Validation</div>
            <div id="v-badge">PENDING</div>
          </div>
        </div>

        <div id="caption"></div>
        <div id="toast">
          <div id="toast-title">⚠ OVER TARGET</div>
          <div id="toast-sub">1 pc over target</div>
        </div>

        <div id="report-card">
          <div class="rline w90"></div>
          <div class="rline w60"></div>
          <div class="rline w40"></div>
          <div class="rline w90" style="margin-top:22px"></div>
          <div class="rline w60"></div>
          <div id="report-tag">REPORT.PDF</div>
        </div>

        <div id="outro">
          <div id="outro-title">Outbound Checklist.</div>
          <div id="outro-sub">One file. Zero build. Every box accounted for.</div>
        </div>
        <div id="outro-wordmark">ARROW</div>
      </section>

      <!-- ══ AUDIO ══ -->
      <audio id="bgm" data-start="0" data-duration="19.5" data-track-index="10" data-volume="1"
        src="assets/music/happy-beats-business-moves-vol-9-by-ende-dot-app.mp3"></audio>

      <audio id="sfx-key1" data-start="0.15" data-track-index="11" data-volume="0.45" src="assets/sfx/keyboard/keypress-003.wav"></audio>
      <audio id="sfx-key2" data-start="0.48" data-track-index="12" data-volume="0.45" src="assets/sfx/keyboard/keypress-007.wav"></audio>
      <audio id="sfx-key3" data-start="0.85" data-track-index="13" data-volume="0.45" src="assets/sfx/keyboard/keypress-011.wav"></audio>
      <audio id="sfx-key4" data-start="1.15" data-track-index="14" data-volume="0.45" src="assets/sfx/keyboard/keypress-015.wav"></audio>
      <audio id="sfx-key5" data-start="1.45" data-track-index="15" data-volume="0.45" src="assets/sfx/keyboard/keypress-019.wav"></audio>
      <audio id="sfx-key6" data-start="1.75" data-track-index="16" data-volume="0.45" src="assets/sfx/keyboard/keypress-023.wav"></audio>

      <audio id="sfx-cut" data-start="3.62" data-track-index="17" data-volume="0.6" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-scan-pn" data-start="4.28" data-track-index="18" data-volume="0.7" src="assets/sfx/interface/click_001.ogg"></audio>
      <audio id="sfx-scan-box1" data-start="4.88" data-track-index="19" data-volume="0.7" src="assets/sfx/interface/click_002.ogg"></audio>
      <audio id="sfx-scan-box2" data-start="5.58" data-track-index="20" data-volume="0.7" src="assets/sfx/interface/click_003.ogg"></audio>

      <!-- beat-locked: 7.38s (cue 7.3956s) -->
      <audio id="sfx-pulse" data-start="7.38" data-track-index="21" data-volume="0.75" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-tabswitch" data-start="8.18" data-track-index="22" data-volume="0.65" src="assets/sfx/interface/switch_004.ogg"></audio>

      <!-- beat-locked: 11.58s (cue 11.5984s) -->
      <audio id="sfx-alert" data-start="11.58" data-track-index="23" data-volume="0.85" src="assets/sfx/interface/error_005.ogg"></audio>
      <audio id="sfx-match" data-start="16.28" data-track-index="24" data-volume="0.75" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    </div>

    <script>
      gsap.registerPlugin(TextPlugin);

      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });

        /* ── Scene 1: Hook typewriter ── */
        const HOOK_TEXT = "One box too many. Almost shipped.";
        tl.to("#hook-line", { text: { value: HOOK_TEXT }, duration: 1.83, ease: "none" }, 0.1);
        tl.to("#hook-cursor", { opacity: 0, duration: 0.25, repeat: 5, yoyo: true, ease: "none" }, 1.0);
        tl.to(["#hook-line", "#hook-cursor"], { autoAlpha: 0, duration: 0.3, ease: "power1.out" }, 3.35);

        /* ── Audio envelope ── */
        tl.fromTo("#bgm", { volume: 0 }, { volume: 0.18, duration: 0.5, ease: "none" }, 0);
        tl.to("#bgm", { volume: 0.32, duration: 0.5, ease: "none" }, 3.7);
        tl.to("#bgm", { volume: 0.1, duration: 0.3, ease: "none" }, 11.2);
        tl.to("#bgm", { volume: 0.3, duration: 0.4, ease: "none" }, 12.3);
        tl.to("#bgm", { volume: 0, duration: 0.8, ease: "none" }, 18.7);

        /* ── Scene 2 entrance: topbar + card slide/fade in ── */
        tl.fromTo("#topbar", { y: -26, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 3.7);
        tl.fromTo("#tabstrip", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: "power2.out" }, 3.85);
        tl.fromTo("#pallet-card", { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.45, ease: "power3.out" }, 3.9);
        tl.set("#tab1", { backgroundColor: "rgba(56,189,248,.14)", borderColor: "#38bdf8", color: "#e6edf3" }, 3.7);
        tl.set("#tab2", { backgroundColor: "transparent", borderColor: "#21262d", color: "#8b949e" }, 3.7);
        tl.set("#pb-fill", { backgroundColor: "#6e7681" }, 3.7);

        /* ── Scan events (Pick PN + two boxes) ── */
        tl.to("#pn-box", { borderColor: "#10b981", backgroundColor: "rgba(16,185,129,.12)", duration: 0.15, yoyo: true, repeat: 1 }, 4.3);

        tl.to("#box1-box", { borderColor: "#10b981", backgroundColor: "rgba(16,185,129,.12)", duration: 0.15, yoyo: true, repeat: 1 }, 4.9);
        tl.to("#pb-fill", { backgroundColor: "#38bdf8", duration: 0.3, ease: "none" }, 4.9);
        tl.fromTo("#pb-fill", { scaleX: 0 }, { scaleX: 6 / 9, duration: 0.5, ease: "power2.out" }, 4.9);
        tl.to({ v: 0 }, {
          v: 6, duration: 0.5, ease: "power2.out",
          onUpdate: function () { document.getElementById("pb-counter").textContent = Math.round(this.targets()[0].v) + " / 9"; }
        }, 4.9);

        tl.to("#box2-box", { borderColor: "#10b981", backgroundColor: "rgba(16,185,129,.12)", duration: 0.15, yoyo: true, repeat: 1 }, 5.6);
        tl.to("#pb-fill", { scaleX: 1, duration: 0.5, ease: "power2.out" }, 5.6);
        tl.to({ v: 6 }, {
          v: 9, duration: 0.5, ease: "power2.out",
          onUpdate: function () { document.getElementById("pb-counter").textContent = Math.round(this.targets()[0].v) + " / 9"; }
        }, 5.6);

        /* ── Scene 3: completion pulse + auto-advance (beat-locked: 7.38s) ── */
        tl.to("#pb-fill", { backgroundColor: "#10b981", duration: 0.25, ease: "none" }, 7.4);
        tl.fromTo("#pallet-card", { boxShadow: "0 0 0 rgba(16,185,129,0)" },
          { boxShadow: "0 0 46px rgba(16,185,129,.35)", duration: 0.3, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, 7.4);

        tl.to("#caption", { text: { value: "Finishes one pallet. Jumps to the next." }, duration: 0.01, ease: "none" }, 7.8);
        tl.fromTo("#caption", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out" }, 7.8);
        tl.to("#caption", { autoAlpha: 0, y: -10, duration: 0.3, ease: "power1.in" }, 10.55);

        tl.to("#tab1", { backgroundColor: "transparent", borderColor: "#21262d", color: "#8b949e", duration: 0.3 }, 8.2);
        tl.to("#tab2", { backgroundColor: "rgba(56,189,248,.14)", borderColor: "#38bdf8", color: "#e6edf3", duration: 0.3 }, 8.2);
        tl.fromTo("#tab2", { boxShadow: "0 0 0 rgba(56,189,248,0)" },
          { boxShadow: "0 0 0 3px rgba(56,189,248,.35)", duration: 0.25, yoyo: true, repeat: 1 }, 8.2);

        /* ── Scene 4: over-target hard stop (beat-locked: 11.58s) ── */
        tl.to("#box2-box", { borderColor: "#dc2626", backgroundColor: "rgba(220,38,38,.14)", duration: 0.2, ease: "power2.out" }, 11.06);
        tl.to({ v: 3 }, {
          v: 4, duration: 0.2, ease: "none",
          onUpdate: function () { document.getElementById("box2-box").textContent = Math.round(this.targets()[0].v); }
        }, 11.1);
        tl.to("#pb-fill", { backgroundColor: "#dc2626", duration: 0.2 }, 11.2);
        tl.to({ v: 9 }, {
          v: 10, duration: 0.2, ease: "none",
          onUpdate: function () { document.getElementById("pb-counter").textContent = Math.round(this.targets()[0].v) + " / 9"; }
        }, 11.2);
        tl.to("#pb-counter", { color: "#f87171", duration: 0.2 }, 11.2);

        tl.fromTo("#toast", { autoAlpha: 0, scale: 0.85, x: "-50%", y: "-50%" },
          { autoAlpha: 1, scale: 1, x: "-50%", y: "-50%", duration: 0.28, ease: "back.out(1.8)" }, 11.58);

        tl.to("#caption", { text: { value: "Scan one too many? It stops. Now — not at the dock." }, duration: 0.01, ease: "none" }, 11.95);
        tl.fromTo("#caption", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, 11.95);
        tl.to(["#caption", "#toast"], { autoAlpha: 0, duration: 0.3, ease: "power1.in" }, 15.3);

        /* ── Scene 5: resolve + outro ── */
        tl.to("#box2-box", { borderColor: "#30363d", backgroundColor: "#0d1117", duration: 0.3 }, 15.85);
        tl.to({ v: 4 }, {
          v: 3, duration: 0.3, ease: "none",
          onUpdate: function () { document.getElementById("box2-box").textContent = Math.round(this.targets()[0].v); }
        }, 15.85);
        tl.to("#pb-fill", { backgroundColor: "#10b981", duration: 0.35 }, 16.0);
        tl.to("#pb-counter", { color: "#e6edf3", duration: 0.3 }, 16.0);
        tl.to({ v: 10 }, {
          v: 9, duration: 0.3, ease: "none",
          onUpdate: function () { document.getElementById("pb-counter").textContent = Math.round(this.targets()[0].v) + " / 9"; }
        }, 16.0);

        tl.to("#v-badge", { text: { value: "✓ MATCH" }, color: "#10b981", duration: 0.2, ease: "none" }, 16.3);

        tl.fromTo("#report-card", { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, 16.6);

        tl.fromTo("#outro", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 17.2);
        tl.fromTo("#outro-wordmark", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "power2.out" }, 17.9);

        window.__timelines["main"] = tl;
        tl.seek(0);
      });
    </script>
  </body>
</html>
