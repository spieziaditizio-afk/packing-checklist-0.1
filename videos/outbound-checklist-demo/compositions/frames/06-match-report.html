    // ---- t=0 landed state -- this frame OPENS mid-crossfade out of Frame 5's

    tl.set("#fr06-glow", { opacity: 0.5 }, 0);
    tl.set("#fr06-report", { opacity: 0, y: 46, scale: 0.96 }, 0);

    // ---- discrete-text-sequence: the badge label is a sparse {t,text} array,
    // reverse-searched every frame -- an instant jump, never a crossfade smear ----
    var SEQUENCE = [
      { t: 0, text: "PENDING" },
      { t: 3.5, text: "✓ MATCH" }
    ];
    function textAt(time) {
      for (var i = SEQUENCE.length - 1; i >= 0; i--) {
        if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
      }
      return "";
    }
    var textEl = document.getElementById("fr06-badge-text");
    var driver = { t: 0 };
    tl.to(
      driver,
      {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: function () {
          textEl.textContent = textAt(driver.t);
        }
      },
      0
    );

    // ---- Scene 1 (0.0-2.0s): "Every pallet resolves to one clear answer -"
    // the red state is still resolving -- a low, slow ambient pulse on the
    // glow keeps the tension alive instead of reading as a dead freeze-frame ----

      glowPhase,
      {
        p: Math.PI * 2 * 2.2,
        duration: 3.0,
        ease: "none",
        onUpdate: function () {
          var s = Math.sin(glowPhase.p);
          gsap.set("#fr06-glow", { opacity: 0.46 + s * 0.08 });
