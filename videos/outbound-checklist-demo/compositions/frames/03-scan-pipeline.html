  <script>
    (function () {
      var D = 8.213;
      var tl = gsap.timeline({ paused: true });

      var GREEN_BG = "rgba(16, 185, 129, 0.16)";
      var GREEN_BORDER = "#10b981";
      var GREEN_GLOW = "0 0 0 4px rgba(16, 185, 129, 0.25)";
      var BASE_BG = "rgba(56, 189, 248, 0.06)";
      var BASE_BORDER = "rgba(56, 189, 248, 0.25)";
      var BASE_SHADOW = "0 0 0 0px rgba(16, 185, 129, 0)";

      // ── plain color-chord flash: field border/background pulses green then returns ──
      function flashField(selector, at) {
        tl.to(
          selector,
          { backgroundColor: GREEN_BG, borderColor: GREEN_BORDER, boxShadow: GREEN_GLOW, duration: 0.15, ease: "power2.out" },
          at,
        )
          .to(
            selector,
            { backgroundColor: BASE_BG, borderColor: BASE_BORDER, boxShadow: BASE_SHADOW, duration: 0.15, ease: "power2.in" },
            at + 0.25,
          );
      }

      // ══ Scene 2 (~1.64–3.53s): "Scan the Pick Label." — PN field flashes green ══
      flashField("#f03sp-pn-field", 1.75);

      // ══ Scene 3 (~3.53–5.75s): "Scan the quantities." — Box 1 then Box 2 flash,
      //     0.6s apart, while the progress bar climbs 0 → 6/9 → 9/9 and the
      //     counter counts up in lockstep (stat-bars-and-fills + counting-dynamic-scale) ══
      var counterEl = document.getElementById("f03sp-counter");
      var count = { value: 0 };

      // Box 1 lands → fill 0 → 6/9, counter 0 → 6
      flashField("#f03sp-box1-field", 3.7);
      tl.to(
        count,
        {
          value: 6,
          duration: 0.7,
          ease: "power2.out",
          onUpdate: function () {
            counterEl.textContent = Math.round(count.value) + " / 9";
          },
        },
        3.7,
      );
      tl.to("#f03sp-fill", { scaleX: 6 / 9, duration: 0.7, ease: "power2.out" }, 3.7);

      // Box 2 lands 0.6s later → fill 6/9 → 9/9, counter 6 → 9
      flashField("#f03sp-box2-field", 4.3);
      tl.to(
        count,
        {
          value: 9,
          duration: 0.7,
          ease: "power2.out",
          onUpdate: function () {
            counterEl.textContent = Math.round(count.value) + " / 9";
          },
        },
        4.3,
      );
      tl.to("#f03sp-fill", { scaleX: 1, duration: 0.7, ease: "power2.out" }, 4.3);

      // Escalating visual weight on the counter across the whole count-up window
      tl.fromTo("#f03sp-counter", { scale: 0.85 }, { scale: 1, duration: 1.3, ease: "power2.out" }, 3.7);

      // ══ Scene 4 (~5.75–8.213s): "Every scan flashes green the second it lands." —
      //     hold on the filled bar. A single settle pulse, then dead-static (no breathing). ══

        .to("#f03sp-progress-wrap", { filter: "drop-shadow(0 0 0px rgba(56,189,248,0))", duration: 0.35, ease: "power2.in" }, 6.15);

      window.__timelines["03-scan-pipeline"] = tl;
      tl.seek(0);
    })();
