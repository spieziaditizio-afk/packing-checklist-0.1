  - generic [ref=f3e121]:
    - heading "Which one to build" [level=2] [ref=f3e122]
    - paragraph [ref=f3e123]: Executive Overview (1) is the safest default if this is a page people open on their own — it answers "how are we doing" and "what just happened" in one scroll. Floor Wallboard (2) is the one worth building first if the goal is a shared monitor on the packing floor itself — nothing to click, readable from a few meters away. Delivery Log (3) and Trends (4) are better as a second screen for a supervisor once the basic numbers exist.
    - paragraph [ref=f3e124]:
      - text: "One thing to flag regardless of which direction: right now each delivery lives only in that browser's own"
      - code [ref=f3e125]: localStorage
      - text: ", scoped to one session — there's no shared place today's numbers from every packing station would already be adding up in. Any of these four needs that piece built first (a small shared store the app writes a summary to when a delivery is completed) before the numbers on screen would be real instead of sample data."